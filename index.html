<!DOCTYPE html>
<html lang="it">
<head>
  <!-- Impostazioni di base: caratteri accentati e adattamento agli schermi piccoli -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus App</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Intestazione: titolo dell'app e interruttore del tema (attivato nella Tappa 3) -->
  <header class="app-header">
    <h1>Focus App</h1>
    <button id="theme-toggle" class="icon-button" type="button" aria-label="Cambia tema">🌙</button>
  </header>

  <!-- Contenuto principale: due sezioni affiancate -->
  <main class="layout">

    <!-- Sezione Pomodoro timer -->
    <section class="card" id="timer-section">
      <h2>Pomodoro</h2>

      <p id="timer-mode" class="timer-mode">Lavoro</p>
      <p id="timer-display" class="timer-display">25:00</p>

      <div class="timer-controls">
        <button id="timer-start" type="button" class="button primary">Avvia</button>
        <button id="timer-reset" type="button" class="button">Reset</button>
      </div>

      <p id="timer-cycle" class="timer-cycle">Ciclo 1 di 4</p>
    </section>

    <!-- Sezione To-do list -->
    <section class="card" id="todo-section">
      <div class="card-header">
        <h2>Task</h2>
        <button id="tags-toggle" type="button" class="button" aria-expanded="false">Tag e filtri</button>
      </div>

      <!-- Pannello tag e filtri: chiuso di default (attributo hidden), gestito da js/tags.js -->
      <div id="tags-panel" class="tags-panel" hidden>
        <form id="tag-form" class="tag-form">
          <input id="tag-name" type="text" placeholder="Nuovo tag (es. lavoro)" maxlength="20" autocomplete="off" required>
          <input id="tag-color" type="color" value="#4f8cff" aria-label="Colore del tag">
          <button type="submit" class="button primary">Crea tag</button>
        </form>
        <p class="hint">Clicca un tag per filtrare le task: vedrai solo quelle che hanno tutti i tag selezionati.</p>
        <div id="tag-list" class="tag-list"></div>
        <button id="filter-clear" type="button" class="button small" hidden>Azzera filtri</button>
      </div>

      <!-- Kanban: tre colonne. data-status collega ogni colonna allo stato delle task.
           Le task vengono create da JavaScript (js/todo.js) dentro ogni <ul>.
           In fondo a ogni colonna: pulsante "Aggiungi task" che apre il campo di testo. -->
      <div class="kanban">
        <div class="kanban-column" data-status="todo">
          <h3>To-do <span class="column-count"></span></h3>
          <ul class="todo-list"></ul>
          <form class="add-form" hidden>
            <input class="add-input" type="text" placeholder="Scrivi e premi Invio" maxlength="200" autocomplete="off" required>
          </form>
          <button type="button" class="add-button" data-action="open-add">+ Aggiungi task</button>
        </div>
        <div class="kanban-column" data-status="doing">
          <h3>In corso <span class="column-count"></span></h3>
          <ul class="todo-list"></ul>
          <form class="add-form" hidden>
            <input class="add-input" type="text" placeholder="Scrivi e premi Invio" maxlength="200" autocomplete="off" required>
          </form>
          <button type="button" class="add-button" data-action="open-add">+ Aggiungi task</button>
        </div>
        <div class="kanban-column" data-status="done">
          <h3>Completate <span class="column-count"></span></h3>
          <ul class="todo-list"></ul>
          <form class="add-form" hidden>
            <input class="add-input" type="text" placeholder="Scrivi e premi Invio" maxlength="200" autocomplete="off" required>
          </form>
          <button type="button" class="add-button" data-action="open-add">+ Aggiungi task</button>
        </div>
      </div>
    </section>

  </main>

  <!-- Il JavaScript viene caricato come modulo (per questo serve Live Server) -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
