<!DOCTYPE html>
<html lang="it">
<head>
  <!-- Impostazioni di base: caratteri accentati e adattamento agli schermi piccoli -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus App</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Intestazione: titolo dell'app e interruttore del tema (attivato nella Tappa 3) -->
  <header class="app-header">
    <h1>Focus App</h1>
    <button id="theme-toggle" class="icon-button" type="button" aria-label="Cambia tema">🌙</button>
  </header>

  <!-- Contenuto principale: due sezioni affiancate -->
  <main class="layout">

    <!-- Sezione Pomodoro timer -->
    <section class="card" id="timer-section">
      <h2>Pomodoro</h2>

      <p id="timer-mode" class="timer-mode">Lavoro</p>
      <p id="timer-display" class="timer-display">25:00</p>

      <div class="timer-controls">
        <button id="timer-start" type="button" class="button primary">Avvia</button>
        <button id="timer-reset" type="button" class="button">Reset</button>
      </div>

      <p id="timer-cycle" class="timer-cycle">Ciclo 1 di 4</p>
    </section>

    <!-- Sezione To-do list -->
    <section class="card" id="todo-section">
      <h2>To-do list</h2>

      <form id="todo-form" class="todo-form">
        <input id="todo-input" type="text" placeholder="Cosa devi fare?" autocomplete="off" required>
        <button type="submit" class="button primary">Aggiungi</button>
      </form>

      <div class="filters" role="group" aria-label="Filtra task">
        <button type="button" class="filter active" data-filter="all">Tutte</button>
        <button type="button" class="filter" data-filter="active">Da fare</button>
        <button type="button" class="filter" data-filter="done">Completate</button>
      </div>

      <!-- Le task vengono create da JavaScript (js/todo.js) -->
      <ul id="todo-list" class="todo-list"></ul>
    </section>

  </main>

  <!-- Il JavaScript viene caricato come modulo (per questo serve Live Server) -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
